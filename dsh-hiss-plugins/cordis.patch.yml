# @hilariouhiss/dsh-hiss-plugins bundle patch: one package, five top-level rows.
#
# The carrier row (`dsh-hiss-plugins`) is an empty host half: it exists so the package
# holds a Loader row, which is what the client module system serves the browser half
# (`lib/client.js`, the Plugins-page management tab) for.
#
# The four feature rows are deliberate TOP-LEVEL rows, never a `cordis:group` with
# children: the plugin manager can only persist enablement for an entry whose parent
# tree is the profile's include and that it can address by row id (see
# `dsh-plugin-manager`'s `listPlugins()`), so a nested row can never be switched from
# the Plugins page. `test/patch.test.js` guards that shape.
#
# The git-bash row therefore carries its realm isolation itself (`isolate`), and its
# module mounts the host `bash` tool inside that same realm.
- insert:
    - id: dsh-hiss-plugins
      name: '@hilariouhiss/dsh-hiss-plugins'

    - id: dsh-hiss-plugins-colgrep
      name: '@hilariouhiss/dsh-hiss-plugins/colgrep'

    - id: dsh-hiss-plugins-codegraph
      name: '@hilariouhiss/dsh-hiss-plugins/codegraph'

    - id: dsh-hiss-plugins-project-mcp
      name: '@hilariouhiss/dsh-hiss-plugins/project-mcp'

    - id: dsh-hiss-plugins-gitbash
      name: '@hilariouhiss/dsh-hiss-plugins/gitbash'
      disabled: !!js process.platform !== 'win32'
      isolate:
        shell: true
        settings: true
