name: publish

# 推一个 <目录名>@<版本> tag（例如 dsh-hiss-plugins@1.0.0）就发布这一个包。
# tag 必须与 <目录名>/package.json 的 version 逐字一致，否则在发布前失败。
# 该版本已存在于 registry 时跳过发布（幂等），其余步骤照跑。
# 手工重跑（tag 已存在、或上一次跑挂了）：gh workflow run publish.yml --ref <tag>
on:
  push:
    tags:
      - "dsh-*@*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # Windows runner：git-bash 那一行只解析 Git for Windows（非 Windows 上必然找不到），
    # 且测试固件按 Windows 路径语义断言（如 C:/other-project 的 resolve 结果），
    # 整套测试的平台基线就是 Windows —— ubuntu 上这些断言不可能通过。
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing（OIDC），不需要任何长期 token
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4 # 与 pnpm-lock.yaml 的生成版本一致

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # 自带 npm >= 11.5.1，trusted publishing 的最低要求
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: 解析 tag 指向的包
        id: target
        # Windows runner 的默认 shell 是 PowerShell，$GITHUB_REF_NAME 会被当成未定义的
        # PS 变量解析成空串 —— 这一步显式用 bash（runner 自带 Git Bash）。
        shell: bash
        run: node scripts/resolve-tag.mjs "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 测试
        run: pnpm test

      # 幂等：该版本已经在 registry 上就跳过发布 —— 重推 tag、或把 tag 指到同一份内容的
      # 新提交时都不会红。判断只用 registry 的公开读，不需要任何凭据。
      - name: 检查该版本是否已发布
        id: published
        shell: bash
        run: |
          name="${{ steps.target.outputs.name }}"
          version="${{ steps.target.outputs.version }}"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version 已在 registry 上，跳过发布。"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # npm 在这里用 GitHub 的 OIDC token 换取一次性发布凭据，并自动生成 provenance。
      # 包内 prepublishOnly 还会再跑一次该包自己的测试。
      - name: 发布 ${{ steps.target.outputs.name }}
        if: steps.published.outputs.already == 'false'
        working-directory: ${{ steps.target.outputs.dir }}
        run: npm publish
